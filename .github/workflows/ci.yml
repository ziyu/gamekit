name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, Build, Lint, Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: corepack pnpm install --frozen-lockfile

      - name: Test
        run: corepack pnpm test

      - name: Build
        run: corepack pnpm build

      - name: Lint
        run: corepack pnpm lint

      - name: Format
        run: corepack pnpm format

  multiplayer-performance:
    name: Multiplayer Performance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: corepack pnpm install --frozen-lockfile

      - name: Performance budgets
        run: corepack pnpm bench:multiplayer:check

      - name: Retained heap stability
        run: corepack pnpm bench:multiplayer:stability
