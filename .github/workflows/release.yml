name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Release version. Defaults to packages/core version.
        required: false
        type: string
      dist-tag:
        description: npm dist-tag.
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - beta
          - rc
          - latest
      packages:
        description: Optional comma-separated package slugs.
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  changesets:
    name: Changesets Version PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      has-changesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: corepack pnpm install --frozen-lockfile

      - name: Create Version PR
        id: changesets
        uses: changesets/action@v1
        with:
          title: Version GameKit packages
          commit: Version GameKit packages
          version: corepack pnpm release:version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish
    needs: changesets
    if: github.event_name == 'push' && needs.changesets.outputs.has-changesets == 'false'
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Version Changes
        id: version-changes
        shell: bash
        run: |
          if git diff-tree --no-commit-id --name-only -r HEAD | grep -E '^packages/[^/]+/package\.json$' >/dev/null; then
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.version-changes.outputs.should-publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        if: steps.version-changes.outputs.should-publish == 'true'
        run: corepack enable

      - name: Install
        if: steps.version-changes.outputs.should-publish == 'true'
        run: corepack pnpm install --frozen-lockfile

      - name: Publish Release
        if: steps.version-changes.outputs.should-publish == 'true'
        run: corepack pnpm release:publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GAMEKITS_RELEASE_DIR: ${{ runner.temp }}/gamekits-release

  manual-release:
    name: Manual Release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: corepack pnpm install --frozen-lockfile

      - name: Resolve Release Inputs
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "GAMEKITS_RELEASE_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          fi
          echo "GAMEKITS_NPM_TAG=${{ inputs.dist-tag }}" >> "$GITHUB_ENV"
          echo "GAMEKITS_RELEASE_DIR=${{ runner.temp }}/gamekits-release" >> "$GITHUB_ENV"
          if [ -n "${{ inputs.packages }}" ]; then
            echo "GAMEKITS_PUBLISH_PACKAGES=${{ inputs.packages }}" >> "$GITHUB_ENV"
          fi

      - name: Publish Release
        run: corepack pnpm release:publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
